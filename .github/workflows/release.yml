name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify-ci:
    name: Verify tag passed CI on main
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag points to a commit on main
        run: |
          git fetch origin main --no-tags
          git merge-base --is-ancestor HEAD origin/main || {
            echo "Tag $GITHUB_REF_NAME does not point to a commit on main" >&2
            exit 1
          }

      - name: Verify successful CI run for tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag_commit=$(git rev-parse HEAD)
          successful_runs=$(gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs" \
            -f head_sha="$tag_commit" -f branch=main -f event=push \
            -f status=completed -f per_page=100 \
            --jq '[.workflow_runs[] | select(.conclusion == "success")] | length')

          if [[ "$successful_runs" -eq 0 ]]; then
            echo "No successful CI run on main found for $tag_commit" >&2
            exit 1
          fi

  release:
    needs: verify-ci
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: 1.27.3
          check-latest: true
          cache: true

      - name: Publish release
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: v2.18.3
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
