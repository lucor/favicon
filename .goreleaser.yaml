version: 2

project_name: favicon

before:
  hooks:
    - go test ./...

builds:
  - id: favicon
    main: ./cmd/favicon
    binary: favicon
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64

archives:
  - id: favicon
    ids:
      - favicon
    formats:
      - tar.gz
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

changelog:
  use: git
